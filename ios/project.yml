name: Yap
options:
  bundleIdPrefix: io.tinkerstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.0

settings:
  base:
    DEVELOPMENT_TEAM: 6GAVK2Q4AG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Yap:
    type: application
    platform: iOS
    sources:
      - path: Yap
      - path: Shared
    info:
      path: Yap/Info.plist
      properties:
        CFBundleDisplayName: Yap
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Yap listens while you talk so it can type what you say.
        # Keeps the mic session alive while you're typing in another app with the Yap keyboard.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: io.tinkerstudio.yap
            CFBundleURLSchemes: [yap]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Yap/Yap.entitlements
      properties:
        com.apple.security.application-groups: [group.io.tinkerstudio.yap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tinkerstudio.yap.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: YapKeyboard
      - package: WhisperKit

  YapKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Yap
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Needed to share results with the app and to open it.
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.io.tinkerstudio.yap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tinkerstudio.yap.ios.keyboard
