[package]
name = "yap"
version = "0.1.0"
description = "Push-to-talk dictation that still sounds like you"
authors = ["Tinker Studio"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519)
name = "yap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
tauri-plugin-dialog = "2"

# Cloud sync: Google sign-in, and encrypting the library before it ever leaves this machine.
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

# Desktop-only: global hotkey, mic capture, clipboard + paste
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
arboard = "3"
enigo = "0.3"
tar = "0.4"
bzip2 = "0.6.1"

# sherpa-onnx everywhere but Windows links its prebuilt static libraries, which carry the
# C++ runtime inside them. whisper.cpp builds against the dynamic runtime, and MSVC refuses
# to link both into one binary. The shared build keeps its runtime inside its own DLLs, so
# only import stubs reach our link. The DLLs ship next to Yap.exe.
[target.'cfg(all(not(any(target_os = "android", target_os = "ios")), not(target_os = "windows")))'.dependencies]
sherpa-onnx = "1.13.7"

# Local Whisper (whisper.cpp). Metal on Apple Silicon, Vulkan on Windows, CPU elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = "0.14"

# Windows gets Vulkan the way macOS gets Metal: whisper.cpp on the GPU. Vulkan rather than
# CUDA so the same build works on AMD and Intel graphics too. Needs the Vulkan SDK to build
# (VULKAN_SDK set); it falls back to the CPU at runtime when there's no usable GPU.
[target.'cfg(target_os = "windows")'.dependencies]
sherpa-onnx = { version = "1.13.7", default-features = false, features = ["shared"] }
whisper-rs = { version = "0.14", features = ["vulkan"] }

[profile.dev.package."*"]
# whisper.cpp is unusably slow unoptimized, even in dev builds
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
